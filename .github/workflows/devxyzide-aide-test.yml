name: DevxyzIDE AIDE Test Build

on:
  push:
    branches: [devxyzide-aide-test]
  workflow_dispatch:

jobs:
  aide-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify AIDE source contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=devxyzide-aide-test
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java"
          grep -F 'rootProject.name = "DevxyzIDE-AIDE-Test"' "$ROOT/settings.gradle"
          grep -F "com.android.tools.build:gradle:7.2.1" "$ROOT/build.gradle"
          grep -F "applicationId 'com.jepongdevxyz.idebuild'" "$ROOT/app/build.gradle"
          grep -F 'minSdkVersion 19' "$ROOT/app/build.gradle"
          grep -F 'targetSdkVersion 29' "$ROOT/app/build.gradle"
          grep -F '<string name="app_name">DevxyzIDE</string>' "$ROOT/app/src/main/res/values/strings.xml"
          if grep -R -E 'androidx\.|com.google.android.material|io.github.rosemoe' "$ROOT/app/build.gradle"; then
            echo 'AIDE test shell must stay dependency-light' >&2
            exit 1
          fi

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Switch to JDK 11 for AGP 7.2.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Build debug APK
        shell: bash
        run: gradle -p devxyzide-aide-test --no-daemon :app:assembleDebug

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp devxyzide-aide-test/app/build/outputs/apk/debug/app-debug.apk dist/DevxyzIDE-AIDE-Test.apk
          sha256sum dist/DevxyzIDE-AIDE-Test.apk | tee dist/DevxyzIDE-AIDE-Test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-AIDE-Test-APK
          path: dist/*
          if-no-files-found: error
