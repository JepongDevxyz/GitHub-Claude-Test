name: DevxyzIDE Reference UI APK Build
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract exact reference UI source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q ci/DevxyzIDE-reference-ui-minimal-source.zip -d work
          test -f work/app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          test -f work/app/src/main/res/layout/activity_main.xml
          test -f work/app/src/main/res/layout-land/activity_main.xml

      - name: Configure build-only modern Android toolchain
        run: |
          cat > work/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DevxyzIDE'
          include ':app'
          EOF
          cat > work/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > work/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jepongdevxyz.idebuild'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jepongdevxyz.idebuild'
                  minSdk 19
                  targetSdk 29
                  versionCode 8
                  versionName '0.6.2-reference-ui'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
          }
          EOF

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build redesigned DevxyzIDE APK
        run: gradle -p work --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="work/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.jepongdevxyz.idebuild'" apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          cp "$APK" DevxyzIDE-v0.6.2-reference-ui-debug.apk
          sha256sum DevxyzIDE-v0.6.2-reference-ui-debug.apk | tee DevxyzIDE-v0.6.2-reference-ui-debug.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.2-reference-ui-apk
          path: |
            DevxyzIDE-v0.6.2-reference-ui-debug.apk
            DevxyzIDE-v0.6.2-reference-ui-debug.apk.sha256
            apk-badging.txt
            apk-signing.txt
          if-no-files-found: error
