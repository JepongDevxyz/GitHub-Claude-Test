name: DevxyzIDE v0.6.5 Import Build Exec
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract exact source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q ci/DevxyzIDE-v0.6.5-build-payload.zip -d work
          test -f work/app/src/main/java/com/jepongdevxyz/idebuild/MainActivity.java
          test -f work/app/src/main/java/com/jepongdevxyz/idebuild/core/toolchain/ExecutionPolicy.java
          grep -q 'REQUIRED_HOST_TARGET_SDK = 28' work/app/src/main/java/com/jepongdevxyz/idebuild/core/toolchain/ExecutionPolicy.java
          grep -q 'project-import-recovery' work/app/src/main/java/com/jepongdevxyz/idebuild/ProjectImportController.java
          grep -q 'findJavaHomeExact' work/app/src/main/java/com/jepongdevxyz/idebuild/core/toolchain/RuntimeLayout.java

      - name: Configure build-only Android toolchain
        run: |
          cat > work/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='DevxyzIDE'
          include ':app'
          EOF
          cat > work/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > work/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.jepongdevxyz.idebuild'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.jepongdevxyz.idebuild'
                  minSdk 19
                  targetSdk 28
                  versionCode 11
                  versionName '0.6.5-import-build-exec-fix'
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {}
          EOF

      - name: Build APK
        run: gradle -p work --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK=work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.jepongdevxyz.idebuild'" apk-badging.txt
          grep -q "targetSdkVersion:'28'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          cp "$APK" DevxyzIDE-v0.6.5-import-build-exec-debug.apk
          sha256sum DevxyzIDE-v0.6.5-import-build-exec-debug.apk | tee DevxyzIDE-v0.6.5-import-build-exec-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-v0.6.5-import-build-exec-apk
          path: |
            DevxyzIDE-v0.6.5-import-build-exec-debug.apk
            DevxyzIDE-v0.6.5-import-build-exec-debug.apk.sha256
            apk-badging.txt
            apk-signing.txt
          if-no-files-found: error
