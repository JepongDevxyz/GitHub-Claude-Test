<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>OpenAPIs Live Tester</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #0b0d12;
      color: #f5f7fb;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 28px;
    }

    .sub {
      margin-top: 0;
      color: #9ca6b8;
      line-height: 1.5;
    }

    .panel {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #252b37;
      border-radius: 18px;
      background: #12151c;
    }

    select,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font-size: 15px;
    }

    select {
      padding: 0 14px;
      color: white;
      background: #191d26;
      border: 1px solid #303746;
    }

    button {
      margin-top: 12px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    #testBtn {
      background: #fff;
      color: #111;
    }

    #allBtn {
      background: #252b37;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #results {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .result {
      padding: 16px;
      border: 1px solid #252b37;
      border-radius: 16px;
      background: #12151c;
      overflow-wrap: anywhere;
    }

    .pass {
      border-color: #238636;
    }

    .fail {
      border-color: #da3633;
    }

    .model {
      font-size: 17px;
      font-weight: 700;
    }

    .status {
      margin-top: 7px;
      font-weight: 700;
    }

    .answer {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #191d26;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .meta {
      margin-top: 8px;
      color: #9ca6b8;
      font-size: 13px;
    }

    details {
      margin-top: 12px;
    }

    pre {
      max-height: 300px;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: #080a0e;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="app">

    <h1>OpenAPIs Live Tester</h1>

    <p class="sub">
      Actual server-side generation test.
      Hindi lang ping o status page.
    </p>

    <section class="panel">

      <select id="model">
        <optgroup label="OpenAI">
          <option value="gpt-5.4">
            GPT-5.4
          </option>

          <option value="gpt-5.4-mini">
            GPT-5.4 Mini
          </option>

          <option value="gpt-5.4-nano">
            GPT-5.4 Nano
          </option>

          <option value="gpt-5.3-codex">
            GPT-5.3 Codex
          </option>

          <option value="gpt-5.3-instant">
            GPT-5.3 Instant
          </option>
        </optgroup>

        <optgroup label="Anthropic">
          <option value="claude-opus-4-7">
            Claude Opus 4.7
          </option>

          <option value="claude-sonnet-4-6">
            Claude Sonnet 4.6
          </option>

          <option value="claude-haiku-4-5">
            Claude Haiku 4.5
          </option>
        </optgroup>
      </select>

      <button id="testBtn">
        Test Selected Model
      </button>

      <button id="allBtn">
        Test All Models
      </button>

    </section>

    <section id="results"></section>

  </main>

<script>
const modelSelect = document.getElementById("model");
const testBtn = document.getElementById("testBtn");
const allBtn = document.getElementById("allBtn");
const results = document.getElementById("results");

const MODELS = [
  "gpt-5.4",
  "gpt-5.4-mini",
  "gpt-5.4-nano",
  "gpt-5.3-codex",
  "gpt-5.3-instant",
  "claude-opus-4-7",
  "claude-sonnet-4-6",
  "claude-haiku-4-5"
];

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

async function testModel(model) {

  const id =
    "r-" +
    Date.now() +
    "-" +
    Math.random().toString(36).slice(2);

  results.insertAdjacentHTML(
    "afterbegin",
    `
      <article class="result" id="${id}">
        <div class="model">
          ${escapeHtml(model)}
        </div>

        <div class="status">
          Testing...
        </div>
      </article>
    `
  );

  const card = document.getElementById(id);

  try {

    const started = performance.now();

    const response = await fetch("/api/test", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model
      })
    });

    const totalLatency =
      Math.round(performance.now() - started);

    const data = await response.json();

    card.classList.add(
      data.ok && data.answer
        ? "pass"
        : "fail"
    );

    const success =
      data.ok &&
      data.answer;

    card.innerHTML = `
      <div class="model">
        ${escapeHtml(model)}
      </div>

      <div class="status">
        ${
          success
            ? "✅ WORKING — actual response received"
            : "❌ FAILED / NO RESPONSE"
        }
      </div>

      ${
        data.answer
          ? `
            <div class="answer">
              ${escapeHtml(data.answer)}
            </div>
          `
          : ""
      }

      <div class="meta">
        Provider:
        ${escapeHtml(data.provider || "unknown")}
        <br>

        HTTP:
        ${escapeHtml(data.httpStatus || response.status)}
        <br>

        API latency:
        ${escapeHtml(data.latency || "N/A")} ms
        <br>

        Total:
        ${totalLatency} ms
      </div>

      <details>
        <summary>
          Raw API response
        </summary>

        <pre>${escapeHtml(
          JSON.stringify(data.raw || data, null, 2)
        )}</pre>
      </details>
    `;

    return success;

  } catch (error) {

    card.classList.add("fail");

    card.innerHTML = `
      <div class="model">
        ${escapeHtml(model)}
      </div>

      <div class="status">
        ❌ REQUEST ERROR
      </div>

      <div class="answer">
        ${escapeHtml(error.message)}
      </div>
    `;

    return false;
  }
}

testBtn.addEventListener(
  "click",
  async () => {

    testBtn.disabled = true;
    allBtn.disabled = true;

    await testModel(
      modelSelect.value
    );

    testBtn.disabled = false;
    allBtn.disabled = false;
  }
);

allBtn.addEventListener(
  "click",
  async () => {

    results.innerHTML = "";

    testBtn.disabled = true;
    allBtn.disabled = true;

    allBtn.textContent =
      "Testing all models...";

    for (const model of MODELS) {
      await testModel(model);
    }

    testBtn.disabled = false;
    allBtn.disabled = false;

    allBtn.textContent =
      "Test All Models";
  }
);
</script>

</body>
</html>
